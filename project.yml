name: BroomSweepy
options:
  bundleIdPrefix: com.broomsweepy
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  BroomSweepy:
    type: application
    platform: macOS
    sources:
      - path: BroomSweepy
        excludes:
          - "Resources/Assets.xcassets"
    resources:
      - path: BroomSweepy/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.broomsweepy.app
        INFOPLIST_FILE: BroomSweepy/Info.plist
        CODE_SIGN_ENTITLEMENTS: BroomSweepy/BroomSweepy.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    entitlements:
      path: BroomSweepy/BroomSweepy.entitlements
