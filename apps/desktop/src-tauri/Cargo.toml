[package]
name = "bloomsweepy-desktop"
version = "1.6.1"
description = "Cross-platform BroomSweepy storage scanner"
authors = ["BroomSweepy contributors"]
edition.workspace = true
license.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bloomsweepy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
embed-resource = "3"
tauri-build = { version = "2", features = [] }

[dependencies]
bloomsweepy-control = { path = "../../../crates/bloomsweepy-control" }
bloomsweepy-core = { path = "../../../crates/bloomsweepy-core" }
blake3 = { workspace = true }
dirs = { workspace = true }
getrandom = { workspace = true }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite.workspace = true
sysinfo = "0.39"
trash = "5.2.6"
tempfile = "3.23"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSUserDefaults"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "NSRunningApplication",
    "NSWorkspace",
    "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSPopover",
    "NSView", "NSViewController", "NSButton", "NSControl", "NSResponder",
    "NSTextField", "NSText", "NSFont", "NSFontDescriptor", "NSColor", "NSImage", "NSCell", "NSButtonCell",
    "NSProgressIndicator", "NSAccessibility", "NSAccessibilityProtocols",
] }
plist = "1.10.0"
tauri-plugin-single-instance = "2"
