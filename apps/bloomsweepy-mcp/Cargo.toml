[package]
name = "bloomsweepy-mcp"
version = "1.1.0"
description = "Thin CLI and MCP bridge for the running BroomSweepy app"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bloomsweepy-control = { path = "../../crates/bloomsweepy-control" }
clap = { version = "4.5", features = ["derive"] }
rmcp = { version = "3.1.4", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1.1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
