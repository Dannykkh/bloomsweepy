name: macOS check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-check:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_SIGNING_IDENTITY: "-"
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Record toolchain versions
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          rustc --version
          cargo --version
          node --version
          npm --version

      - name: Install Tauri frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Prepare native MCP and bounded document helpers
        working-directory: apps/desktop
        env:
          TAURI_ENV_TARGET_TRIPLE: aarch64-apple-darwin
        run: npm run prepare:sidecar

      - name: Check Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Check Tauri frontend
        working-directory: apps/desktop
        run: |
          npm run check
          npm run test:all
          npm run build

      - name: Build ad-hoc signed Tauri app
        working-directory: apps/desktop
        run: npx tauri build --bundles app

      - name: Validate Tauri app bundle
        shell: bash
        run: |
          set -euo pipefail
          app="target/release/bundle/macos/BroomSweepy.app"
          plist="$app/Contents/Info.plist"

          test -d "$app"
          plutil -lint "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = \
            "com.broomsweepy.desktop"

          executable="$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist"
          )"
          helper="$app/Contents/MacOS/bloomsweepy-mcp"
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$version"
          test -x "$app/Contents/MacOS/$executable"
          file "$app/Contents/MacOS/$executable" | grep -q arm64
          test -x "$helper"
          file "$helper" | grep -q arm64
          test "$("$helper" --version)" = "bloomsweepy-mcp $version"
          codesign -vvv --strict "$helper"
          document_helper="$app/Contents/MacOS/bloomsweepy-document-worker"
          test -x "$document_helper"
          file "$document_helper" | grep -q arm64
          test "$("$document_helper" --version)" = "bloomsweepy-document-worker $version"
          test "$("$document_helper" --check-heap-budget)" = "heap-budget-rejection-ok"
          codesign -vvv --strict "$document_helper"
          codesign -vvv --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -q "Signature=adhoc"

      - name: Create and verify ARM64 DMG
        shell: bash
        run: |
          set -euo pipefail
          app="target/release/bundle/macos/BroomSweepy.app"
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)*$ ]]
          output_dir="target/release/bundle/dmg"
          dmg_name="BroomSweepy_${version}_aarch64.dmg"
          dmg="$output_dir/$dmg_name"

          test -d "$app"
          mkdir -p "$output_dir"
          test ! -e "$dmg"
          test ! -e "$dmg.sha256"
          stage="$(mktemp -d "$RUNNER_TEMP/broomsweepy-dmg.XXXXXX")"
          ditto "$app" "$stage/BroomSweepy.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -srcfolder "$stage" -volname "BroomSweepy $version" \
            -fs HFS+ -format UDZO "$dmg"
          test -s "$dmg"
          hdiutil verify "$dmg"
          (
            cd "$output_dir"
            shasum -a 256 "$dmg_name" | tee "$dmg_name.sha256"
            shasum -a 256 -c "$dmg_name.sha256"
          )

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v6
        with:
          name: BroomSweepy-macOS-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/dmg/*.dmg.sha256
